<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Impeller parameter diagrams</title>
    <style>
      body {
        margin: 0;
        background: #f5f7f6;
        color: #17231f;
        font-family: Arial, sans-serif;
      }
      main {
        display: grid;
        gap: 18px;
        padding: 18px;
      }
      figure {
        margin: 0;
        border: 1px solid #d8e0dc;
        border-radius: 8px;
        background: white;
        padding: 10px;
      }
      figcaption {
        margin: 4px 0 10px;
        font-size: 14px;
        font-weight: 700;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Meridional support parameters</figcaption>
        <img src="01_meridional_parameters.svg" alt="Meridional support parameters" />
      </figure>
      <figure>
        <figcaption>Blade UV boundaries</figcaption>
        <img src="02_blade_uv_boundaries.svg" alt="Blade UV boundaries" />
      </figure>
      <figure>
        <figcaption>Blade thickness and lean</figcaption>
        <img src="03_blade_thickness_and_lean.svg" alt="Blade thickness and lean" />
      </figure>
      <figure>
        <figcaption>Open and closed tip support</figcaption>
        <img src="04_open_closed_tip_support.svg" alt="Open and closed tip support" />
      </figure>
    </main>
  </body>
</html>
